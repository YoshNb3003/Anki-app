<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暗記マーカーマスク</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 10px; background: #f4f4f4; color: #333; }
    h2, h3 { margin: 10px 0; }
    #canvas-container { margin: 10px auto; max-width: 100%; overflow: auto; background: #fff; border: 1px solid #ccc; position: relative; display: inline-block; }
    canvas { display: block; margin: 0 auto; max-width: 100%; }
    
    .controls { margin: 15px auto; max-width: 500px; padding: 15px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .control-group { margin: 10px 0; text-align: left; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    input[type="range"] { width: 100%; }
    .button-group { margin-top: 15px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    button, input[type="file"] { padding: 10px 15px; font-size: 15px; border-radius: 5px; border: 1px solid #888; background: #fff; cursor: pointer; }
    button.primary { background: #007bff; color: white; border: none; font-weight: bold; }
    button.success { background: #28a745; color: white; border: none; font-weight: bold; }
    button.danger { background: #dc3545; color: white; border: none; padding: 4px 8px; font-size: 12px; }
    .val-display { float: right; color: #666; font-weight: normal; }

    /* 保存カード一覧のスタイル */
    .gallery-section { margin: 30px auto; max-width: 600px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 15px; }
    .card-item { border: 1px solid #ddd; border-radius: 6px; padding: 8px; background: #fafafa; display: flex; flex-direction: column; align-items: center; }
    .card-item img { width: 100%; height: 110px; object-fit: cover; border-radius: 4px; cursor: pointer; }
    .card-title { font-size: 12px; margin: 6px 0; color: #555; }
    
    /* 暗記・閲覧モーダル */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
    .modal-body { position: relative; max-width: 95%; max-height: 80vh; overflow: auto; background: #fff; border-radius: 4px; }
    .modal-body canvas { display: block; }
    .modal-controls { margin-top: 10px; display: flex; gap: 10px; }
    .modal-controls button { padding: 8px 16px; border-radius: 20px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>暗記マーカーアプリv1.0</h2>

  <input type="file" id="imageInput" accept="image/*" capture="environment">

  <div class="controls">
    <div class="control-group">
      <label>マーカーの色:
        <select id="colorSelect">
          <option value="pink">ピンク</option>
          <option value="yellow">黄色</option>
          <option value="green">緑</option>
        </select>
      </label>
    </div>

    <div class="control-group">
      <label for="tolerance">
        検出の感度 (判定範囲)
        <span id="toleranceVal" class="val-display">70</span>
      </label>
      <input type="range" id="tolerance" min="10" max="150" value="70">
    </div>

    <div class="button-group">
      <button id="applyBtn" class="primary">マーカーを自動隠し</button>
      <button id="resetBtn">リセット</button>
      <button id="saveDbBtn" class="success">カードとして保存</button>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="mainCanvas"></canvas>
  </div>

  <!-- 一覧表示セクション -->
  <div class="gallery-section">
    <h3>保存した暗記カード一覧</h3>
    <div id="cardGrid" class="card-grid"></div>
  </div>

  <!-- 暗記用モーダル（タップで正解表示） -->
  <div id="modal" class="modal">
    <div class="modal-body">
      <canvas id="studyCanvas"></canvas>
    </div>
    <div class="modal-controls">
      <button onclick="toggleAllMasks(false)">すべて表示</button>
      <button onclick="toggleAllMasks(true)">すべて隠す</button>
      <button style="background: #fff; color: #333;" onclick="closeModal()">閉じる</button>
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const applyBtn = document.getElementById('applyBtn');
    const resetBtn = document.getElementById('resetBtn');
    const saveDbBtn = document.getElementById('saveDbBtn');
    const colorSelect = document.getElementById('colorSelect');
    const toleranceInput = document.getElementById('tolerance');
    const toleranceVal = document.getElementById('toleranceVal');
    const cardGrid = document.getElementById('cardGrid');

    // 暗記モーダル用
    const studyCanvas = document.getElementById('studyCanvas');
    const studyCtx = studyCanvas.getContext('2d');

    let originalImage = null;
    let detectedRects = []; // 検出された黒塗り矩形リスト [{x, y, w, h, hidden: true}]
    let currentStudyCard = null;
    let db = null;

    // --- 1. IndexedDB 初期化 ---
    const request = indexedDB.open('AnkiAppDB', 2); // バージョン更新
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (db.objectStoreNames.contains('cards')) db.deleteObjectStore('cards');
      db.createObjectStore('cards', { keyPath: 'id', autoIncrement: true });
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      loadSavedCards();
    };

    // --- 2. 画像読み込み ---
    toleranceInput.addEventListener('input', (e) => toleranceVal.textContent = e.target.value);

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = () => {
        const maxDimension = 1600;
        let width = img.width, height = img.height;
        if (width > maxDimension || height > maxDimension) {
          if (width > height) { height = Math.round((height * maxDimension) / width); width = maxDimension; }
          else { width = Math.round((width * maxDimension) / height); height = maxDimension; }
        }

        canvas.width = width; canvas.height = height;
        ctx.drawImage(img, 0, 0, width, height);
        originalImage = img;
        applyMask();
      };
      img.src = URL.createObjectURL(file);
    });

    // --- 3. マーカー検出＆領域グループ化 ---
    function applyMask() {
      if (!originalImage) return;
      ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const w = canvas.width, h = canvas.height;
      const targetColor = colorSelect.value;
      const tolerance = parseInt(toleranceInput.value, 10);

      // マスクビットマップの作成
      const mask = new Uint8Array(w * h);
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        const [hVal, s, v] = rgbToHsv(r, g, b);
        if (isColorMatch(hVal, s, v, targetColor, tolerance, r, g, b)) {
          mask[i / 4] = 1;
        }
      }

      // 簡易連結領域抽出 (矩形化)
      detectedRects = extractRectangles(mask, w, h);

      // 描画
      drawPreview();
    }

    // プレビュー描画（作成画面用）
    function drawPreview() {
      ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#000000';
      detectedRects.forEach(r => {
        ctx.fillRect(r.x, r.y, r.w, r.h);
      });
    }

    // 検出ピクセルをブロックごとの矩形（マスク枠）にまとめる
    function extractRectangles(mask, w, h) {
      const rects = [];
      const visited = new Uint8Array(w * h);
      const step = 8; // グリッド単位でグループ化

      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          const idx = y * w + x;
          if (mask[idx] && !visited[idx]) {
            // 範囲の探査
            let minX = x, maxX = x, minY = y, maxY = y;
            for (let dy = 0; dy < 40 && (y + dy) < h; dy += step) {
              for (let dx = 0; dx < 120 && (x + dx) < w; dx += step) {
                const cIdx = (y + dy) * w + (x + dx);
                if (mask[cIdx]) {
                  visited[cIdx] = 1;
                  if (x + dx > maxX) maxX = x + dx;
                  if (y + dy > maxY) maxY = y + dy;
                }
              }
            }
            if (maxX - minX > 15 && maxY - minY > 10) {
              rects.push({
                x: minX,
                y: minY,
                w: (maxX - minX) + step,
                h: (maxY - minY) + step,
                hidden: true
              });
            }
          }
        }
      }
      return rects;
    }

    function isColorMatch(h, s, v, type, tolerance, r, g, b) {
      if (s < 0.15 || v < 0.25) return false;
      const hueRange = tolerance * 0.75; 
      if (type === 'pink') {
        const targetHue = 335;
        let diff = Math.abs(h - targetHue);
        if (diff > 180) diff = 360 - diff;
        if (diff <= hueRange) return true;
        if (r > 150 && b > 100 && (r - g) > (40 - tolerance*0.2)) return true;
      } else if (type === 'yellow') {
        const targetHue = 55;
        let diff = Math.abs(h - targetHue);
        if (diff > 180) diff = 360 - diff;
        if (diff <= hueRange) return true;
      } else if (type === 'green') {
        const targetHue = 120;
        let diff = Math.abs(h - targetHue);
        if (diff > 180) diff = 360 - diff;
        if (diff <= hueRange) return true;
      }
      return false;
    }

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      const d = max - min;
      let h, s = (max === 0 ? 0 : d / max), v = max;
      if (max !== min) {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h * 360, s, v];
    }

    // --- 4. 保存処理（元画像＋矩形データ） ---
    saveDbBtn.addEventListener('click', () => {
      if (!originalImage) return alert('画像を読み込んでください');

      // 元画像をデータURL化
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = canvas.width;
      tempCanvas.height = canvas.height;
      tempCanvas.getContext('2d').drawImage(originalImage, 0, 0, canvas.width, canvas.height);
      const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.85);

      const now = new Date();
      const dateStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

      const tx = db.transaction('cards', 'readwrite');
      tx.objectStore('cards').add({
        originalImage: dataUrl,
        rects: JSON.parse(JSON.stringify(detectedRects)), // 複製
        createdAt: dateStr
      });

      tx.oncomplete = () => {
        alert('暗記カードを保存しました！');
        loadSavedCards();
      };
    });

    // --- 5. 一覧表示 ---
    function loadSavedCards() {
      if (!db) return;
      cardGrid.innerHTML = '';
      const tx = db.transaction('cards', 'readonly');
      const request = tx.objectStore('cards').openCursor(null, 'prev');

      request.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          const card = cursor.value;
          const cardEl = document.createElement('div');
          cardEl.className = 'card-item';
          
          // 一覧サムネイル用に簡易描画
          const thumbCanvas = document.createElement('canvas');
          thumbCanvas.width = 140; thumbCanvas.height = 110;
          const tCtx = thumbCanvas.getContext('2d');
          const tImg = new Image();
          tImg.onload = () => {
            tCtx.drawImage(tImg, 0, 0, 140, 110);
            tCtx.fillStyle = '#000';
            const scaleX = 140 / canvas.width;
            const scaleY = 110 / canvas.height;
            card.rects.forEach(r => tCtx.fillRect(r.x * scaleX, r.y * scaleY, r.w * scaleX, r.h * scaleY));
          };
          tImg.src = card.originalImage;

          cardEl.innerHTML = `
            <img src="${card.originalImage}" onclick="startStudy(${card.id})" title="タップして暗記開始">
            <div class="card-title">${card.createdAt} (${card.rects.length}箇所)</div>
            <button class="danger" onclick="deleteCard(${card.id})">削除</button>
          `;
          cardGrid.appendChild(cardEl);
          cursor.continue();
        }
      };
    }

    // --- 6. 暗記モーダル（タップで正解判定） ---
    function startStudy(id) {
      const tx = db.transaction('cards', 'readonly');
      const req = tx.objectStore('cards').get(id);
      req.onsuccess = () => {
        currentStudyCard = req.result;
        // 状態初期化（すべて隠す）
        currentStudyCard.rects.forEach(r => r.hidden = true);

        const img = new Image();
        img.onload = () => {
          studyCanvas.width = img.width;
          studyCanvas.height = img.height;
          currentStudyCard.imgObj = img;
          renderStudyCanvas();
          document.getElementById('modal').style.display = 'flex';
        };
        img.src = currentStudyCard.originalImage;
      };
    }

    // 学習用Canvasの描画
    function renderStudyCanvas() {
      if (!currentStudyCard) return;
      studyCtx.drawImage(currentStudyCard.imgObj, 0, 0);

      currentStudyCard.rects.forEach(r => {
        if (r.hidden) {
          studyCtx.fillStyle = '#000000';
          studyCtx.fillRect(r.x, r.y, r.w, r.h);
        } else {
          // 正解表示時：薄い赤枠で囲んで「表示中」であることを示す
          studyCtx.strokeStyle = 'rgba(255, 0, 0, 0.4)';
          studyCtx.lineWidth = 2;
          studyCtx.strokeRect(r.x, r.y, r.w, r.h);
        }
      });
    }

    // Canvasタップ判定（黒塗りを押すと消える）
    studyCanvas.addEventListener('click', (e) => {
      if (!currentStudyCard) return;

      const rect = studyCanvas.getBoundingClientRect();
      const scaleX = studyCanvas.width / rect.width;
      const scaleY = studyCanvas.height / rect.height;

      const clickX = (e.clientX - rect.left) * scaleX;
      const clickY = (e.clientY - rect.top) * scaleY;

      // クリック位置がどのマスの中に含まれるか判定
      currentStudyCard.rects.forEach(r => {
        if (clickX >= r.x && clickX <= r.x + r.w && clickY >= r.y && clickY <= r.y + r.h) {
          r.hidden = !r.hidden; // 非表示/表示を切り替え
        }
      });

      renderStudyCanvas();
    });

    function toggleAllMasks(hideState) {
      if (!currentStudyCard) return;
      currentStudyCard.rects.forEach(r => r.hidden = hideState);
      renderStudyCanvas();
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
      currentStudyCard = null;
    }

    function deleteCard(id) {
      if (!confirm('このカードを削除しますか？')) return;
      const tx = db.transaction('cards', 'readwrite');
      tx.objectStore('cards').delete(id);
      tx.oncomplete = () => loadSavedCards();
    }

    // イベント設定
    applyBtn.addEventListener('click', applyMask);
    colorSelect.addEventListener('change', applyMask);
    toleranceInput.addEventListener('input', applyMask);

    resetBtn.addEventListener('click', () => {
      if (originalImage) ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
    });
  </script>
</body>
</html>
